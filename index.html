<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小安的怪獸世界 - 67攻擊！</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #2c3e50);
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            width: 100%;
            max-width: 600px;
            background: rgba(44, 44, 44, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 2px solid #444;
        }
        .battlefield {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 30px 0;
        }
        .character-box {
            text-align: center;
            width: 40%;
        }
        .character-img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ffcc00;
            background-color: #444;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
        }
        .monster-display {
            font-size: 80px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 2s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .stats {
            font-size: 16px;
            margin-top: 10px;
            font-weight: bold;
        }
        .attack-btn {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }
        .attack-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
        }
        .attack-btn:active {
            transform: scale(0.95);
        }
        #log {
            margin-top: 25px;
            height: 120px;
            background: #111;
            border-radius: 10px;
            padding: 12px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
            font-size: 14px;
            color: #00ffcc;
            border: 1px solid #333;
        }
        .vs-text {
            font-size: 32px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>⚔️ 小安的怪獸世界 ⚔️</h1>
        <p style="color: #aaa; font-size: 14px;">生存於充滿怪獸的異世界，擊敗一隻，更強的怪獸即將降臨！</p>

        <div class="battlefield">
            <!-- 主角小安 -->
            <div class="character-box">
                <h3 style="margin-bottom: 10px;">小安</h3>
                <img id="player-img" class="character-img" alt="小安照片">
                <div class="stats">攻擊力: <span style="color: #ff4757;">67</span></div>
            </div>

            <div class="vs-text">VS</div>

            <!-- 怪獸 -->
            <div class="character-box">
                <h3 id="monster-name" style="margin-bottom: 10px;">初階史萊姆</h3>
                <div id="monster-avatar" class="monster-display">👾</div>
                <div class="stats">血量: <span id="monster-hp" style="color: #2ed573;">100</span> / <span id="monster-max-hp">100</span></div>
            </div>
        </div>

        <!-- 攻擊按鈕 -->
        <button class="attack-btn" onclick="attackMonster()">🔥 使用 67 攻擊！</button>

        <!-- 戰鬥紀錄 -->
        <div id="log">【系統】小安進入了怪獸世界，遭遇了敵人！準備迎戰！</div>
    </div>

    <script>
        // ==========================================
        // 🛠️ 在這裡填入你的連結 (直接替換引號裡面的網址)
        // ==========================================
        const XIAOAN_IMAGE_URL = "https://files.catbox.moe/zw8vg1.jpg";
        const ATTACK_SOUND_URL = "https://files.catbox.moe/o7kbw0.mp3";
        // ==========================================

        // 初始化載入圖片與音效
        document.getElementById('player-img').src = XIAOAN_IMAGE_URL;
        const attackSound = new Audio(ATTACK_SOUND_URL);

        // 遊戲狀態變數
        let monsterLevel = 1;
        let currentMonsterHp = 100;
        let maxMonsterHp = 100;
        let monsterName = "初階史萊姆";
        
        const monsterIcons = ["👾", "🐉", "👹", "🤖", "👽", "👿", "🦖", "💀"];
        const monsterNamesList = [
            "初階史萊姆", "狂暴野豬", "熔岩巨獸", "深淵惡魔", 
            "機械霸王龍", "暗影魔王", "毀滅者·克蘇魯", "次元主宰"
        ];

        function attackMonster() {
            const logBox = document.getElementById('log');

            // 1. 播放音效
            attackSound.currentTime = 0;
            attackSound.play().catch(error => {
                console.log("音效無法自動播放或網址無效");
            });

            // 2. 扣除血量 (固定 67 傷害)
            let damage = 67;
            currentMonsterHp -= damage;
            if (currentMonsterHp < 0) currentMonsterHp = 0;

            // 3. 更新畫面
            document.getElementById('monster-hp').innerText = currentMonsterHp;

            // 4. 寫入戰鬥紀錄
            logBox.innerHTML += `<br>💥 小安使出 **67攻擊**！對 ${monsterName} 造成 <span style="color:#ff4757;">${damage}</span> 點傷害。`;
            logBox.scrollTop = logBox.scrollHeight;

            // 5. 判斷怪獸是否死亡
            if (currentMonsterHp <= 0) {
                monsterLevel++;
                logBox.innerHTML += `<br><span style="color: #ffd700; font-weight:bold;">🎉 恭喜！${monsterName} 被消滅了！更強的怪獸出現了！</span>`;
                spawnNewMonster();
            }
        }

        function spawnNewMonster() {
            // 每過一隻，血量等比提升，越來越難打
            maxMonsterHp = Math.floor(maxMonsterHp * 1.6) + 35;
            currentMonsterHp = maxMonsterHp;

            let nameIndex = (monsterLevel - 1) % monsterNamesList.length;
            let iconIndex = (monsterLevel - 1) % monsterIcons.length;
            
            monsterName = `[Lv.${monsterLevel}] ` + monsterNamesList[nameIndex];
            
            document.getElementById('monster-name').innerText = monsterName;
            document.getElementById('monster-avatar').innerText = monsterIcons[iconIndex];
            document.getElementById('monster-hp').innerText = currentMonsterHp;
            document.getElementById('monster-max-hp').innerText = maxMonsterHp;
        }
    </script>
</body>
</html>
